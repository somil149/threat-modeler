<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mobile Menu Test</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #0f1419;
  color: white;
}

.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: 280px;
  background: #1a1f2e;
  transform: translateX(-100%);
  transition: transform 0.3s ease;
  z-index: 100;
  padding: 20px;
}

.sidebar.open {
  transform: translateX(0);
}

.mobile-menu-toggle {
  position: fixed;
  top: 1rem;
  left: 1rem;
  z-index: 1000;
  background: #3b82f6;
  color: white;
  border: none;
  border-radius: 0.5rem;
  padding: 0.75rem;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.main-content {
  padding: 80px 20px 20px 20px;
}

.backdrop {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 99;
}

.backdrop.show {
  display: block;
}
</style>
</head>
<body>

<button class="mobile-menu-toggle" id="menuBtn">☰</button>

<div class="backdrop" id="backdrop"></div>

<div class="sidebar" id="sidebar">
  <h2>Sidebar Menu</h2>
  <ul style="list-style: none; margin-top: 20px;">
    <li style="padding: 10px 0;">Dashboard</li>
    <li style="padding: 10px 0;">Architecture</li>
    <li style="padding: 10px 0;">Threats</li>
    <li style="padding: 10px 0;">Settings</li>
  </ul>
</div>

<div class="main-content">
  <h1>Mobile Menu Test</h1>
  <p>Click the ☰ button in the top-left to open the sidebar.</p>
  <p style="margin-top: 20px;">Window width: <span id="width"></span>px</p>
  <p>Sidebar open: <span id="status">false</span></p>
</div>

<script>
const menuBtn = document.getElementById('menuBtn');
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('backdrop');
const statusEl = document.getElementById('status');
const widthEl = document.getElementById('width');

let isOpen = false;

function updateWidth() {
  widthEl.textContent = window.innerWidth;
}

function toggleMenu() {
  isOpen = !isOpen;
  console.log('Toggle menu, isOpen:', isOpen);
  
  if (isOpen) {
    sidebar.classList.add('open');
    backdrop.classList.add('show');
    menuBtn.textContent = '✕';
    statusEl.textContent = 'true';
  } else {
    sidebar.classList.remove('open');
    backdrop.classList.remove('show');
    menuBtn.textContent = '☰';
    statusEl.textContent = 'false';
  }
}

menuBtn.addEventListener('click', toggleMenu);
backdrop.addEventListener('click', toggleMenu);

updateWidth();
window.addEventListener('resize', updateWidth);
</script>

</body>
</html>
