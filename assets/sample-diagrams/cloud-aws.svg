<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650">
  <!-- Title -->
  <text x="400" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Cloud Architecture (AWS)</text>
  
  <!-- Internet -->
  <ellipse cx="400" cy="100" rx="80" ry="40" fill="#95A5A6" stroke="#7F8C8D" stroke-width="2"/>
  <text x="400" y="105" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Internet</text>
  
  <!-- CloudFront -->
  <rect x="320" y="180" width="160" height="60" rx="5" fill="#FF9900" stroke="#CC7A00" stroke-width="2"/>
  <text x="400" y="205" font-size="13" font-weight="bold" text-anchor="middle" fill="white">CloudFront CDN</text>
  <text x="400" y="225" font-size="10" text-anchor="middle" fill="white">(Content Delivery)</text>
  
  <!-- ALB -->
  <rect x="320" y="280" width="160" height="60" rx="5" fill="#3498DB" stroke="#2874A6" stroke-width="2"/>
  <text x="400" y="305" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Load Balancer</text>
  <text x="400" y="325" font-size="10" text-anchor="middle" fill="white">(ALB)</text>
  
  <!-- EC2 Instance 1 -->
  <rect x="150" y="390" width="120" height="70" rx="5" fill="#E67E22" stroke="#BA6A1A" stroke-width="2"/>
  <text x="210" y="420" font-size="12" font-weight="bold" text-anchor="middle" fill="white">EC2 Instance</text>
  <text x="210" y="440" font-size="10" text-anchor="middle" fill="white">(Web Server)</text>
  
  <!-- EC2 Instance 2 -->
  <rect x="320" y="390" width="120" height="70" rx="5" fill="#E67E22" stroke="#BA6A1A" stroke-width="2"/>
  <text x="380" y="420" font-size="12" font-weight="bold" text-anchor="middle" fill="white">EC2 Instance</text>
  <text x="380" y="440" font-size="10" text-anchor="middle" fill="white">(Web Server)</text>
  
  <!-- Lambda -->
  <rect x="490" y="390" width="120" height="70" rx="5" fill="#9B59B6" stroke="#6C3483" stroke-width="2"/>
  <text x="550" y="420" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Lambda</text>
  <text x="550" y="440" font-size="10" text-anchor="middle" fill="white">(Serverless)</text>
  
  <!-- RDS -->
  <ellipse cx="210" cy="550" rx="70" ry="45" fill="#527FFF" stroke="#3A5FCC" stroke-width="2"/>
  <text x="210" y="545" font-size="12" font-weight="bold" text-anchor="middle" fill="white">RDS</text>
  <text x="210" y="565" font-size="10" text-anchor="middle" fill="white">(PostgreSQL)</text>
  
  <!-- S3 -->
  <rect x="490" y="510" width="120" height="70" rx="5" fill="#27AE60" stroke="#1E8449" stroke-width="2"/>
  <text x="550" y="540" font-size="12" font-weight="bold" text-anchor="middle" fill="white">S3 Bucket</text>
  <text x="550" y="560" font-size="10" text-anchor="middle" fill="white">(Object Storage)</text>
  
  <!-- ElastiCache -->
  <rect x="650" y="390" width="120" height="70" rx="5" fill="#E74C3C" stroke="#A93226" stroke-width="2"/>
  <text x="710" y="420" font-size="12" font-weight="bold" text-anchor="middle" fill="white">ElastiCache</text>
  <text x="710" y="440" font-size="10" text-anchor="middle" fill="white">(Redis)</text>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  
  <line x1="400" y1="140" x2="400" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <line x1="400" y1="240" x2="400" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <line x1="400" y1="340" x2="210" y2="390" stroke="#333" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <line x1="400" y1="340" x2="380" y2="390" stroke="#333" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <line x1="400" y1="340" x2="550" y2="390" stroke="#333" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <line x1="210" y1="460" x2="210" y2="505" stroke="#333" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <line x1="380" y1="460" x2="210" y2="505" stroke="#333" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <line x1="550" y1="460" x2="550" y2="510" stroke="#333" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <line x1="440" y1="425" x2="650" y2="425" stroke="#333" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- Labels -->
  <text x="420" y="165" font-size="10" fill="#666">HTTPS</text>
  <text x="420" y="265" font-size="10" fill="#666">HTTPS</text>
  <text x="210" y="485" font-size="10" fill="#666">SQL</text>
  <text x="550" y="490" font-size="10" fill="#666">S3 API</text>
  <text x="545" y="410" font-size="10" fill="#666">Cache</text>
</svg>
