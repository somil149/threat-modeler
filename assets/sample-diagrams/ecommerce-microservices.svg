<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <!-- Title -->
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">E-Commerce Microservices Architecture</text>
  
  <!-- User/Client -->
  <rect x="50" y="100" width="120" height="80" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2" rx="5"/>
  <text x="110" y="145" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Web Browser</text>
  
  <rect x="50" y="220" width="120" height="80" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2" rx="5"/>
  <text x="110" y="265" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Mobile App</text>
  
  <!-- API Gateway -->
  <rect x="250" y="150" width="140" height="100" fill="#E67E22" stroke="#C0392B" stroke-width="2" rx="5"/>
  <text x="320" y="195" font-size="14" font-weight="bold" text-anchor="middle" fill="white">API Gateway</text>
  <text x="320" y="215" font-size="11" text-anchor="middle" fill="white">(Kong/NGINX)</text>
  
  <!-- Microservices -->
  <rect x="470" y="80" width="130" height="70" fill="#27AE60" stroke="#1E8449" stroke-width="2" rx="5"/>
  <text x="535" y="120" font-size="13" font-weight="bold" text-anchor="middle" fill="white">User Service</text>
  
  <rect x="470" y="170" width="130" height="70" fill="#27AE60" stroke="#1E8449" stroke-width="2" rx="5"/>
  <text x="535" y="210" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Product Service</text>
  
  <rect x="470" y="260" width="130" height="70" fill="#27AE60" stroke="#1E8449" stroke-width="2" rx="5"/>
  <text x="535" y="300" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Order Service</text>
  
  <rect x="470" y="350" width="130" height="70" fill="#27AE60" stroke="#1E8449" stroke-width="2" rx="5"/>
  <text x="535" y="390" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Payment Service</text>
  
  <!-- Message Queue -->
  <rect x="680" y="250" width="140" height="80" fill="#9B59B6" stroke="#6C3483" stroke-width="2" rx="5"/>
  <text x="750" y="285" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Message Queue</text>
  <text x="750" y="305" font-size="11" text-anchor="middle" fill="white">(RabbitMQ/Kafka)</text>
  
  <!-- Databases -->
  <rect x="680" y="80" width="130" height="60" fill="#34495E" stroke="#2C3E50" stroke-width="2" rx="5"/>
  <text x="745" y="115" font-size="12" font-weight="bold" text-anchor="middle" fill="white">User DB</text>
  
  <rect x="680" y="160" width="130" height="60" fill="#34495E" stroke="#2C3E50" stroke-width="2" rx="5"/>
  <text x="745" y="195" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Product DB</text>
  
  <rect x="680" y="360" width="130" height="60" fill="#34495E" stroke="#2C3E50" stroke-width="2" rx="5"/>
  <text x="745" y="395" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Order DB</text>
  
  <!-- Cache -->
  <rect x="900" y="120" width="120" height="60" fill="#E74C3C" stroke="#C0392B" stroke-width="2" rx="5"/>
  <text x="960" y="155" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Redis Cache</text>
  
  <!-- External Services -->
  <rect x="900" y="360" width="120" height="60" fill="#F39C12" stroke="#D68910" stroke-width="2" rx="5"/>
  <text x="960" y="385" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Payment</text>
  <text x="960" y="405" font-size="11" text-anchor="middle" fill="white">Gateway (Stripe)</text>
  
  <!-- Connections -->
  <line x1="170" y1="140" x2="250" y2="180" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="170" y1="260" x2="250" y2="220" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <line x1="390" y1="200" x2="470" y2="115" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="390" y1="200" x2="470" y2="205" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="390" y1="200" x2="470" y2="295" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="390" y1="200" x2="470" y2="385" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <line x1="600" y1="115" x2="680" y2="110" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="205" x2="680" y2="190" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="295" x2="680" y2="290" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="295" x2="680" y2="390" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="385" x2="680" y2="290" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <line x1="600" y1="115" x2="900" y2="150" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="385" x2="900" y2="390" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>