<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Kubernetes Microservices Platform</text>
  
  <!-- Kubernetes Cluster Border -->
  <rect x="200" y="80" width="900" height="650" fill="none" stroke="#326CE5" stroke-width="3" stroke-dasharray="10,5" rx="10"/>
  <text x="650" y="110" font-size="16" font-weight="bold" fill="#326CE5">Kubernetes Cluster</text>
  
  <!-- Ingress -->
  <rect x="250" y="140" width="150" height="70" fill="#00D9FF" stroke="#00A8CC" stroke-width="2" rx="5"/>
  <text x="325" y="170" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Ingress Controller</text>
  <text x="325" y="190" font-size="11" text-anchor="middle" fill="white">(NGINX/Traefik)</text>
  
  <!-- Services -->
  <rect x="250" y="250" width="130" height="60" fill="#326CE5" stroke="#1E4BA3" stroke-width="2" rx="5"/>
  <text x="315" y="285" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Frontend Service</text>
  
  <rect x="450" y="250" width="130" height="60" fill="#326CE5" stroke="#1E4BA3" stroke-width="2" rx="5"/>
  <text x="515" y="285" font-size="12" font-weight="bold" text-anchor="middle" fill="white">API Service</text>
  
  <rect x="650" y="250" width="130" height="60" fill="#326CE5" stroke="#1E4BA3" stroke-width="2" rx="5"/>
  <text x="715" y="285" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Auth Service</text>
  
  <rect x="850" y="250" width="130" height="60" fill="#326CE5" stroke="#1E4BA3" stroke-width="2" rx="5"/>
  <text x="915" y="285" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Worker Service</text>
  
  <!-- Pods -->
  <rect x="250" y="350" width="60" height="50" fill="#13AA52" stroke="#0F8A42" stroke-width="2" rx="3"/>
  <text x="280" y="380" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Pod 1</text>
  
  <rect x="320" y="350" width="60" height="50" fill="#13AA52" stroke="#0F8A42" stroke-width="2" rx="3"/>
  <text x="350" y="380" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Pod 2</text>
  
  <rect x="450" y="350" width="60" height="50" fill="#13AA52" stroke="#0F8A42" stroke-width="2" rx="3"/>
  <text x="480" y="380" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Pod 1</text>
  
  <rect x="520" y="350" width="60" height="50" fill="#13AA52" stroke="#0F8A42" stroke-width="2" rx="3"/>
  <text x="550" y="380" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Pod 2</text>
  
  <rect x="650" y="350" width="60" height="50" fill="#13AA52" stroke="#0F8A42" stroke-width="2" rx="3"/>
  <text x="680" y="380" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Pod 1</text>
  
  <rect x="720" y="350" width="60" height="50" fill="#13AA52" stroke="#0F8A42" stroke-width="2" rx="3"/>
  <text x="750" y="380" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Pod 2</text>
  
  <rect x="850" y="350" width="60" height="50" fill="#13AA52" stroke="#0F8A42" stroke-width="2" rx="3"/>
  <text x="880" y="380" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Pod 1</text>
  
  <rect x="920" y="350" width="60" height="50" fill="#13AA52" stroke="#0F8A42" stroke-width="2" rx="3"/>
  <text x="950" y="380" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Pod 2</text>
  
  <!-- ConfigMap & Secrets -->
  <rect x="250" y="450" width="120" height="50" fill="#F4C430" stroke="#C49A26" stroke-width="2" rx="5"/>
  <text x="310" y="480" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">ConfigMap</text>
  
  <rect x="400" y="450" width="120" height="50" fill="#E74C3C" stroke="#C0392B" stroke-width="2" rx="5"/>
  <text x="460" y="480" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Secrets</text>
  
  <!-- Persistent Volumes -->
  <rect x="250" y="540" width="120" height="50" fill="#9B59B6" stroke="#6C3483" stroke-width="2" rx="5"/>
  <text x="310" y="570" font-size="11" font-weight="bold" text-anchor="middle" fill="white">PV/PVC</text>
  
  <!-- Service Mesh -->
  <rect x="550" y="450" width="140" height="50" fill="#00D9FF" stroke="#00A8CC" stroke-width="2" rx="5"/>
  <text x="620" y="475" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Service Mesh</text>
  <text x="620" y="490" font-size="10" text-anchor="middle" fill="white">(Istio/Linkerd)</text>
  
  <!-- Monitoring -->
  <rect x="750" y="450" width="120" height="50" fill="#FF6B6B" stroke="#CC5555" stroke-width="2" rx="5"/>
  <text x="810" y="475" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Prometheus</text>
  <text x="810" y="490" font-size="10" text-anchor="middle" fill="white">(Monitoring)</text>
  
  <rect x="900" y="450" width="120" height="50" fill="#4ECDC4" stroke="#3EA39C" stroke-width="2" rx="5"/>
  <text x="960" y="475" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Grafana</text>
  <text x="960" y="490" font-size="10" text-anchor="middle" fill="white">(Dashboards)</text>
  
  <!-- External DB -->
  <rect x="550" y="600" width="140" height="60" fill="#336791" stroke="#2A5373" stroke-width="2" rx="5"/>
  <text x="620" y="625" font-size="12" font-weight="bold" text-anchor="middle" fill="white">PostgreSQL</text>
  <text x="620" y="645" font-size="10" text-anchor="middle" fill="white">(External DB)</text>
  
  <!-- Redis -->
  <rect x="750" y="600" width="120" height="60" fill="#DC382D" stroke="#B02D24" stroke-width="2" rx="5"/>
  <text x="810" y="625" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Redis</text>
  <text x="810" y="645" font-size="10" text-anchor="middle" fill="white">(Cache)</text>
  
  <!-- External User -->
  <rect x="50" y="160" width="100" height="60" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2" rx="5"/>
  <text x="100" y="195" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Users</text>
  
  <!-- Connections -->
  <line x1="150" y1="190" x2="250" y2="175" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="325" y1="210" x2="315" y2="250" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="325" y1="210" x2="515" y2="250" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="325" y1="210" x2="715" y2="250" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <line x1="515" y1="310" x2="620" y2="600" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="515" y1="310" x2="810" y2="600" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>