<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Title -->
  <text x="450" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Microservices Architecture</text>
  
  <!-- API Gateway -->
  <rect x="370" y="80" width="160" height="70" rx="5" fill="#3498DB" stroke="#2874A6" stroke-width="2"/>
  <text x="450" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="white">API Gateway</text>
  <text x="450" y="130" font-size="11" text-anchor="middle" fill="white">(Kong)</text>
  
  <!-- User Service -->
  <rect x="100" y="220" width="130" height="70" rx="5" fill="#E67E22" stroke="#BA6A1A" stroke-width="2"/>
  <text x="165" y="250" font-size="13" font-weight="bold" text-anchor="middle" fill="white">User Service</text>
  <text x="165" y="270" font-size="10" text-anchor="middle" fill="white">(Node.js)</text>
  
  <!-- Order Service -->
  <rect x="270" y="220" width="130" height="70" rx="5" fill="#27AE60" stroke="#1E8449" stroke-width="2"/>
  <text x="335" y="250" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Order Service</text>
  <text x="335" y="270" font-size="10" text-anchor="middle" fill="white">(Python)</text>
  
  <!-- Payment Service -->
  <rect x="440" y="220" width="130" height="70" rx="5" fill="#E74C3C" stroke="#A93226" stroke-width="2"/>
  <text x="505" y="250" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Payment Service</text>
  <text x="505" y="270" font-size="10" text-anchor="middle" fill="white">(Java)</text>
  
  <!-- Notification Service -->
  <rect x="610" y="220" width="140" height="70" rx="5" fill="#9B59B6" stroke="#6C3483" stroke-width="2"/>
  <text x="680" y="250" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Notification Service</text>
  <text x="680" y="270" font-size="10" text-anchor="middle" fill="white">(Go)</text>
  
  <!-- User DB -->
  <ellipse cx="165" cy="420" rx="60" ry="40" fill="#5DADE2" stroke="#2E86AB" stroke-width="2"/>
  <text x="165" y="420" font-size="12" font-weight="bold" text-anchor="middle" fill="white">User DB</text>
  <text x="165" y="435" font-size="10" text-anchor="middle" fill="white">(MySQL)</text>
  
  <!-- Order DB -->
  <ellipse cx="335" cy="420" rx="60" ry="40" fill="#5DADE2" stroke="#2E86AB" stroke-width="2"/>
  <text x="335" y="420" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Order DB</text>
  <text x="335" y="435" font-size="10" text-anchor="middle" fill="white">(Postgres)</text>
  
  <!-- Payment DB -->
  <ellipse cx="505" cy="420" rx="60" ry="40" fill="#5DADE2" stroke="#2E86AB" stroke-width="2"/>
  <text x="505" y="420" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Payment DB</text>
  <text x="505" y="435" font-size="10" text-anchor="middle" fill="white">(MongoDB)</text>
  
  <!-- Message Queue -->
  <rect x="610" y="390" width="140" height="60" rx="5" fill="#F39C12" stroke="#CA7A0A" stroke-width="2"/>
  <text x="680" y="415" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Message Queue</text>
  <text x="680" y="435" font-size="10" text-anchor="middle" fill="white">(RabbitMQ)</text>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  
  <line x1="450" y1="150" x2="165" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="150" x2="335" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="150" x2="505" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="150" x2="680" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <line x1="165" y1="290" x2="165" y2="380" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="335" y1="290" x2="335" y2="380" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="505" y1="290" x2="505" y2="380" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="290" x2="680" y2="390" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <line x1="400" y1="255" x2="610" y2="420" stroke="#333" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  
  <!-- Labels -->
  <text x="300" y="180" font-size="10" fill="#666">REST</text>
  <text x="165" y="345" font-size="10" fill="#666">SQL</text>
  <text x="335" y="345" font-size="10" fill="#666">SQL</text>
  <text x="505" y="345" font-size="10" fill="#666">NoSQL</text>
  <text x="500" y="350" font-size="10" fill="#666">Events</text>
</svg>
